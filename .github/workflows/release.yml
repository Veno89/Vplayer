name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          shared-key: release-validation
          cache-on-failure: true

      - name: Install exact frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify tag and version contract
        run: npm run check:versions

      - name: Verify frontend
        run: npm run verify:frontend

      - name: Verify production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Install pinned RustSec scanner
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Verify Rust dependency advisories
        # RUSTSEC-2026-0235 is present only behind rust_decimal's inactive optional
        # rkyv feature; cargo tree for the Windows release target does not select it.
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0235

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Verify Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets

      - name: Verify Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Verify Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets

  draft-release:
    name: Build signed updater draft
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          shared-key: release-build
          cache-on-failure: true

      - name: Install exact frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify release inputs
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run check:versions
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required to create updater artifacts.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required to create updater artifacts.'
          }

      - name: Build and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VPlayer ${{ github.ref_name }}'
          releaseBody: |
            Automated draft from ${{ github.sha }}. Verify the attached release evidence,
            checksums, updater signature, and Authenticode status before publishing.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          tauriScript: npm run tauri

      - name: Generate release evidence and dependency manifests
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'release-evidence'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $bundleRoot = Join-Path $PWD 'src-tauri/target/release/bundle'
          $artifacts = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File)
          if ($artifacts.Count -eq 0) { throw 'No bundle artifacts were produced.' }
          if (-not ($artifacts | Where-Object Extension -eq '.sig')) {
            throw 'No updater signature was produced.'
          }

          $checksumLines = $artifacts | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($bundleRoot, $_.FullName).Replace('\', '/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $checksumLines | Set-Content -LiteralPath (Join-Path $releaseDir 'SHA256SUMS.txt') -Encoding utf8

          $installerEvidence = @($artifacts | Where-Object {
            $_.Extension -eq '.exe' -and $_.DirectoryName -like '*\bundle\nsis*'
          } | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
            [ordered]@{
              file = $_.Name
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              sizeBytes = $_.Length
              authenticodeStatus = $signature.Status.ToString()
              signerThumbprint = $signature.SignerCertificate.Thumbprint
              timestampThumbprint = $signature.TimeStamperCertificate.Thumbprint
            }
          })
          if ($installerEvidence.Count -eq 0) { throw 'No NSIS installer was produced.' }

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $evidence = [ordered]@{
            schemaVersion = 1
            product = 'VPlayer'
            version = $version
            tag = $env:GITHUB_REF_NAME
            commit = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            workflowRun = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            generatedAtUtc = [DateTime]::UtcNow.ToString('o')
            updaterSignaturePresent = $true
            authenticodePolicy = 'Drafts may be unsigned; publish only installers whose status is Valid.'
            installers = $installerEvidence
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $releaseDir 'release-evidence.json') -Encoding utf8

          npm sbom --sbom-format cyclonedx | Set-Content -LiteralPath (Join-Path $releaseDir 'npm-sbom.cdx.json') -Encoding utf8
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 | Set-Content -LiteralPath (Join-Path $releaseDir 'cargo-metadata.json') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $releaseDir 'npm-sbom.cdx.json') -Raw | ConvertFrom-Json | Out-Null
          Get-Content -LiteralPath (Join-Path $releaseDir 'cargo-metadata.json') -Raw | ConvertFrom-Json | Out-Null

      - name: Attach release evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:GITHUB_REF_NAME `
            release-evidence/SHA256SUMS.txt `
            release-evidence/release-evidence.json `
            release-evidence/npm-sbom.cdx.json `
            release-evidence/cargo-metadata.json `
            --clobber
