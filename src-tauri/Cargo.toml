[package]
name = "vplayer"
version = "0.9.50"
description = "A modern music player"
authors = ["Veno"]
license = "MIT"
repository = "https://github.com/Veno89/Vplayer"
edition = "2024"
rust-version = "1.98"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rodio = { version = "0.22.2", features = ["symphonia-all"] }
symphonia = { version = "0.6.1", features = ["all"] }
lofty = "0.25.1"
walkdir = "2.5.0"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
tokio = { version = "1.53.1", features = ["full"] }
log = "0.4.34"
tauri-plugin-log = "2.9.1"
notify = "8.2.0"
anyhow = "1.0.104"
base64 = "0.23.1"
ebur128 = "0.1.10"
rustfft = "6.4.1"
uuid = { version = "1.26.0", features = ["v4"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
